
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub - Student Management System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background: #f4f5fb;
            color: #252541;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        header {
            background: #6651c9;
            color: white;
            padding: 25px;
            border-radius: 14px;
            margin-bottom: 22px;
        }

        header h1 {
            margin: 0 0 8px;
        }

        header p {
            margin-bottom: 0;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 15px;
            margin-bottom: 22px;
        }

        .stat, .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px #0000000d;
        }

        .stat strong {
            display: block;
            margin-top: 8px;
            font-size: 28px;
            color: #6651c9;
        }

        .card {
            margin-bottom: 22px;
        }

        h2 {
            margin-top: 0;
        }

        label {
            display: block;
            font-weight: bold;
            margin: 12px 0 6px;
        }

        input, select {
            width: 100%;
            padding: 11px;
            border: 1px solid #d8d8e5;
            border-radius: 7px;
            font-size: 15px;
            background: white;
        }

        button {
            background: #6651c9;
            color: white;
            border: none;
            padding: 10px 14px;
            margin: 5px 3px 5px 0;
            border-radius: 7px;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            opacity: 0.85;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .secondary {
            background: #656579;
        }

        .danger {
            background: #d94747;
        }

        .success {
            background: #21865b;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px 16px;
        }

        .actions {
            margin-top: 15px;
        }

        .filters {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 12px;
            margin-bottom: 15px;
        }

        .student-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 15px;
        }

        .student-card {
            padding: 16px;
            border: 1px solid #e4e2f1;
            border-radius: 10px;
            overflow-wrap: anywhere;
            background: #fff;
        }

        .student-card h3 {
            margin-top: 0;
            margin-bottom: 10px;
            color: #5143a3;
        }

        .details {
            line-height: 1.8;
            color: #5c5c70;
            font-size: 14px;
        }

        .message {
            margin: 12px 0;
            color: #5143a3;
            overflow-wrap: anywhere;
        }

        .empty {
            padding: 20px;
            color: #666;
            text-align: center;
            grid-column: 1 / -1;
        }

        a {
            color: #6651c9;
            overflow-wrap: anywhere;
        }

        .api-info {
            background: #f6f4ff;
            padding: 12px;
            border-radius: 8px;
            margin: 12px 0;
            overflow-wrap: anywhere;
        }

        .small-text {
            font-size: 13px;
            color: #666;
        }

        @media (max-width: 650px) {
            body {
                padding: 12px;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .form-grid,
            .filters,
            .student-grid {
                grid-template-columns: 1fr;
            }

            .card {
                padding: 15px;
            }
        }
    </style>
</head>

<body>
<div class="container">

    <header>
        <h1>StudentHub</h1>
        <p>Student Management and Partner API Exchange</p>
    </header>

    <!-- STATISTICS -->
    <section class="stats">
        <div class="stat">
            Total Students
            <strong id="totalStudents">0</strong>
        </div>

        <div class="stat">
            BSIT Students
            <strong id="bsitStudents">0</strong>
        </div>

        <div class="stat">
            Partner Records
            <strong id="partnerCount">0</strong>
        </div>
    </section>

    <!-- ADD AND EDIT STUDENT -->
    <section class="card">
        <h2 id="formTitle">Add Student</h2>

        <form id="studentForm">
            <input type="hidden" id="databaseId">

            <div class="form-grid">
                <div>
                    <label for="studentId">Student ID</label>
                    <input
                        type="text"
                        id="studentId"
                        placeholder="Enter student ID"
                        required
                    >
                </div>

                <div>
                    <label for="studentName">Full Name</label>
                    <input
                        type="text"
                        id="studentName"
                        placeholder="Enter full name"
                        required
                    >
                </div>

                <div>
                    <label for="program">Program</label>
                    <input
                        type="text"
                        id="program"
                        value="BSIT"
                        required
                    >
                </div>

                <div>
                    <label for="year">Year Level</label>
                    <select id="year" required>
                        <option value="1">1st Year</option>
                        <option value="2">2nd Year</option>
                        <option value="3" selected>3rd Year</option>
                        <option value="4">4th Year</option>
                    </select>
                </div>

                <div>
                    <label for="section">Section</label>
                    <input
                        type="text"
                        id="section"
                        placeholder="Example: BSIT 3B"
                        required
                    >
                </div>
            </div>

            <div class="actions">
                <button type="submit" id="saveButton">
                    Save Student
                </button>

                <button
                    type="button"
                    class="secondary"
                    onclick="resetForm()"
                >
                    Clear Form
                </button>
            </div>

            <p id="formMessage" class="message" role="status"></p>
        </form>
    </section>

    <!-- MY STUDENTS -->
    <section class="card">
        <h2>My Students</h2>

        <div class="filters">
            <input
                type="search"
                id="searchInput"
                placeholder="Search name, student ID, program, or section"
            >

            <select id="sectionFilter">
                <option value="">All Sections</option>
            </select>
        </div>

        <button type="button" onclick="loadStudents()">
            Refresh Students
        </button>

        <p id="localMessage" class="message" role="status"></p>
        <div id="studentList" class="student-grid"></div>
    </section>

    <!-- PARTNER RECORDS -->
    <section class="card">
        <h2>Partner Student Records</h2>

        <div class="api-info">
            <strong>Partner Read API</strong>
            <p>
                <a
                    href="https://hemarpaulabian.onrender.com/students"
                    target="_blank"
                    rel="noopener noreferrer"
                >https://hemarpaulabian.onrender.com/students</a>
            </p>

            <p class="small-text">
                Records are retrieved from your partner's API through your Flask backend.
            </p>
        </div>

        <button
            type="button"
            onclick="loadClassmateRecords()"
            id="loadPartnerButton"
        >
            Load Partner Records
        </button>

        <p id="classmateMessage" class="message" role="status"></p>
        <div id="classmateStudents" class="student-grid"></div>
    </section>

</div>

<script>
    let localStudents = [];
    let partnerStudents = [];

    // API REQUEST HELPER
    async function fetchJSON(url, options = {}) {
        const response = await fetch(url, options);

        let data;

        try {
            data = await response.json();
        } catch {
            throw new Error("The server returned an invalid response.");
        }

        if (!response.ok) {
            throw new Error(
                data.message || `Request failed with status ${response.status}`
            );
        }

        return data;
    }

    // SAFELY DISPLAY TEXT IN HTML
    function escapeHTML(value) {
        return String(value ?? "").replace(/[&<>"']/g, character => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        })[character]);
    }

    // NORMALIZE PARTNER FIELD NAMES
    function getPartnerStudent(student) {
        return {
            student_id: String(
                student.student_id ?? student.studentId ?? ""
            ).trim(),

            name: String(
                student.name ?? student.student_name ?? ""
            ).trim(),

            program: String(
                student.program ?? student.course ?? "BSIT"
            ).trim(),

            year: Number(
                student.year ?? student.year_level ?? 3
            ),

            section: String(
                student.section ?? ""
            ).trim()
        };
    }

    // UPDATE DASHBOARD COUNTS
    function updateStats() {
        document.getElementById("totalStudents").textContent =
            localStudents.length;

        document.getElementById("bsitStudents").textContent =
            localStudents.filter(student =>
                String(student.program).toUpperCase() === "BSIT"
            ).length;

        document.getElementById("partnerCount").textContent =
            partnerStudents.length;
    }

    // LOAD LOCAL STUDENTS
    async function loadStudents() {
        const message = document.getElementById("localMessage");

        try {
            localStudents = await fetchJSON("/students");

            updateSectionFilter();
            displayStudents();
            updateStats();

            message.textContent = "";
        } catch (error) {
            message.textContent =
                "Unable to load students: " + error.message;
        }
    }

    // BUILD SECTION FILTER
    function updateSectionFilter() {
        const filter = document.getElementById("sectionFilter");
        const previous = filter.value;

        const sections = [
            ...new Set(
                localStudents
                    .map(student => student.section)
                    .filter(Boolean)
            )
        ].sort();

        filter.innerHTML = '<option value="">All Sections</option>';

        sections.forEach(section => {
            const option = document.createElement("option");
            option.value = section;
            option.textContent = section;
            filter.appendChild(option);
        });

        if (sections.includes(previous)) {
            filter.value = previous;
        }
    }

    // DISPLAY LOCAL STUDENTS
    function displayStudents() {
        const container = document.getElementById("studentList");

        const search = document.getElementById("searchInput")
            .value.toLowerCase().trim();

        const selectedSection =
            document.getElementById("sectionFilter").value;

        const filtered = localStudents.filter(student => {
            const searchable = [
                student.id,
                student.student_id,
                student.name,
                student.program,
                student.year,
                student.section
            ].join(" ").toLowerCase();

            return searchable.includes(search) &&
                (!selectedSection || student.section === selectedSection);
        });

        if (filtered.length === 0) {
            container.innerHTML =
                '<div class="empty">No matching student records found.</div>';
            return;
        }

        container.innerHTML = filtered.map(student => `
            <article class="student-card">
                <h3>${escapeHTML(student.name)}</h3>

                <div class="details">
                    <div><b>Database ID:</b> ${escapeHTML(student.id)}</div>
                    <div><b>Student ID:</b> ${escapeHTML(student.student_id)}</div>
                    <div><b>Program:</b> ${escapeHTML(student.program)}</div>
                    <div><b>Year:</b> ${escapeHTML(student.year)}</div>
                    <div><b>Section:</b> ${escapeHTML(student.section)}</div>
                </div>

                <button
                    type="button"
                    onclick="editStudent(${Number(student.id)})"
                >Edit</button>

                <button
                    type="button"
                    class="danger"
                    onclick="deleteStudent(${Number(student.id)})"
                >Delete</button>

                <button
                    type="button"
                    class="success"
                    onclick="sendStudentToPartner(${Number(student.id)})"
                >Send to Partner</button>
            </article>
        `).join("");
    }

    // ADD OR UPDATE STUDENT
    document.getElementById("studentForm").addEventListener(
        "submit",
        async function(event) {
            event.preventDefault();

            const message = document.getElementById("formMessage");
            const id = document.getElementById("databaseId").value;

            const student = {
                student_id: document.getElementById("studentId").value.trim(),
                name: document.getElementById("studentName").value.trim(),
                program: document.getElementById("program").value.trim(),
                year: Number(document.getElementById("year").value),
                section: document.getElementById("section").value.trim()
            };

            try {
                const url = id
                    ? `/api/students/${encodeURIComponent(id)}`
                    : "/api/students";

                const method = id ? "PUT" : "POST";

                const result = await fetchJSON(url, {
                    method: method,
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(student)
                });

                message.textContent =
                    result.message || "Student saved successfully.";

                resetForm();
                await loadStudents();

            } catch (error) {
                message.textContent = "Save failed: " + error.message;
            }
        }
    );

    // EDIT STUDENT
    function editStudent(id) {
        const student = localStudents.find(
            item => Number(item.id) === Number(id)
        );

        if (!student) {
            return;
        }

        document.getElementById("databaseId").value = student.id;
        document.getElementById("studentId").value = student.student_id;
        document.getElementById("studentName").value = student.name;
        document.getElementById("program").value = student.program;
        document.getElementById("year").value = student.year;
        document.getElementById("section").value = student.section;

        document.getElementById("formTitle").textContent = "Edit Student";
        document.getElementById("saveButton").textContent = "Update Student";

        document.getElementById("studentForm").scrollIntoView({
            behavior: "smooth",
            block: "start"
        });
    }

    // RESET FORM
    function resetForm() {
        document.getElementById("studentForm").reset();
        document.getElementById("databaseId").value = "";
        document.getElementById("program").value = "BSIT";
        document.getElementById("year").value = "3";
        document.getElementById("formTitle").textContent = "Add Student";
        document.getElementById("saveButton").textContent = "Save Student";
        document.getElementById("formMessage").textContent = "";
    }

    // DELETE STUDENT
    async function deleteStudent(id) {
        if (!confirm("Are you sure you want to delete this student?")) {
            return;
        }

        const message = document.getElementById("localMessage");

        try {
            const result = await fetchJSON(
                `/api/students/${encodeURIComponent(id)}`,
                { method: "DELETE" }
            );

            message.textContent =
                result.message || "Student deleted successfully.";

            await loadStudents();

        } catch (error) {
            message.textContent = "Delete failed: " + error.message;
        }
    }

    // LOAD PARTNER RECORDS THROUGH FLASK
    async function loadClassmateRecords() {
        const container = document.getElementById("classmateStudents");
        const message = document.getElementById("classmateMessage");
        const button = document.getElementById("loadPartnerButton");

        container.innerHTML = "";
        message.textContent = "Loading partner records...";
        button.disabled = true;

        try {
            const result = await fetchJSON("/partner-records");

            partnerStudents = Array.isArray(result.students)
                ? result.students
                : [];

            updateStats();

            if (partnerStudents.length === 0) {
                message.textContent = "No partner records were found.";
                return;
            }

            message.textContent =
                `Loaded ${partnerStudents.length} partner record(s).`;

            container.innerHTML = partnerStudents.map((original, index) => {
                const student = getPartnerStudent(original);

                return `
                    <article class="student-card">
                        <h3>${escapeHTML(student.name || "Unknown Student")}</h3>

                        <div class="details">
                            <div><b>Student ID:</b> ${escapeHTML(student.student_id || "N/A")}</div>
                            <div><b>Program:</b> ${escapeHTML(student.program || "N/A")}</div>
                            <div><b>Year:</b> ${escapeHTML(student.year)}</div>
                            <div><b>Section:</b> ${escapeHTML(student.section || "N/A")}</div>
                        </div>

                        <button
                            type="button"
                            class="success"
                            onclick="importPartnerStudent(${index})"
                        >Import to My Database</button>
                    </article>
                `;
            }).join("");

        } catch (error) {
            message.textContent =
                "Unable to load partner records: " + error.message;
        } finally {
            button.disabled = false;
        }
    }

    // IMPORT ONE PARTNER RECORD
    async function importPartnerStudent(index) {
        const message = document.getElementById("classmateMessage");
        const original = partnerStudents[index];

        if (!original) {
            message.textContent = "Partner record not found.";
            return;
        }

        const student = getPartnerStudent(original);

        if (
            !student.student_id ||
            !student.name ||
            !student.section ||
            !Number.isInteger(student.year) ||
            student.year < 1
        ) {
            message.textContent =
                "Cannot import: this record has missing or invalid student details.";
            return;
        }

        try {
            const result = await fetchJSON("/import-student", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(student)
            });

            message.textContent =
                result.message || "Partner student imported successfully.";

            await loadStudents();

        } catch (error) {
            message.textContent = "Import failed: " + error.message;
        }
    }

    // SEND ONE LOCAL STUDENT TO PARTNER
    async function sendStudentToPartner(id) {
        const message = document.getElementById("localMessage");

        if (!confirm("Send this student record to your partner's API?")) {
            return;
        }

        try {
            const result = await fetchJSON("/send-to-partner", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ id: id })
            });

            message.textContent =
                result.message || "Student sent to partner.";

        } catch (error) {
            message.textContent =
                "Sending failed: " + error.message;
        }
    }

    // SEARCH AND FILTER
    document.getElementById("searchInput").addEventListener(
        "input",
        displayStudents
    );

    document.getElementById("sectionFilter").addEventListener(
        "change",
        displayStudents
    );

    // INITIAL LOAD
    loadStudents();
</script>

</body>
</html>
