
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Database Interface</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f8;
            color: #222;
            margin: 0;
            padding: 25px;
        }

        .container {
            max-width: 750px;
            margin: auto;
            padding: 25px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        h1, h2 {
            color: #234a76;
        }

        button {
            padding: 10px 15px;
            background: #2463a6;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px 0;
        }

        button:hover {
            background: #174675;
        }

        input, select {
            padding: 10px;
            margin: 5px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .student {
            padding: 12px;
            margin: 10px 0;
            background: #f2f6fb;
            border-left: 4px solid #2463a6;
            border-radius: 4px;
            overflow-wrap: anywhere;
        }

        .result {
            margin-top: 15px;
            line-height: 1.6;
        }

        hr {
            margin: 25px 0;
            border: 0;
            border-top: 1px solid #ddd;
        }
    </style>
</head>

<body>
<div class="container">

    <h1>Student Database Interface</h1>
    <p>Laboratory Activity 7: Integrating SQLite with Flask API</p>

    <h2>All Students</h2>
    <button onclick="loadStudents()">Load Students</button>
    <div id="studentList" class="result"></div>

    <hr>

    <h2>Find Student by Database ID</h2>
    <input
        type="number"
        id="studentId"
        min="1"
        placeholder="Enter ID (1-5)"
    >
    <button onclick="findStudent()">Find Student</button>
    <div id="singleStudent" class="result"></div>

    <hr>

    <h2>Filter Students by Section</h2>
    <label for="sectionInput">Select section:</label>
    <select id="sectionInput">
        <option value="A">Section A</option>
        <option value="B">Section B</option>
    </select>
    <button onclick="filterStudents()">Filter Students</button>
    <div id="sectionResults" class="result"></div>

</div>

<script>
    // Load all students
    async function loadStudents() {
        const output = document.getElementById("studentList");
        output.textContent = "Loading students...";

        try {
            const response = await fetch("/students");

            if (!response.ok) {
                throw new Error("Unable to load students");
            }

            const students = await response.json();
            output.replaceChildren();

            if (students.length === 0) {
                output.textContent = "No student records found.";
                return;
            }

            students.forEach(student => {
                const card = document.createElement("div");
                card.className = "student";

                const details = document.createElement("p");
                details.textContent =
                    "Database ID: " + student.id +
                    " | Student ID: " + student.student_id +
                    " | Name: " + student.name +
                    " | Program: " + student.program +
                    " | Year: " + student.year +
                    " | Section: " + student.section;

                card.appendChild(details);
                output.appendChild(card);
            });
        } catch (error) {
            output.textContent = "Unable to retrieve student records.";
            console.error(error);
        }
    }


    // Find one student by database ID
    async function findStudent() {
        const id = document.getElementById("studentId").value.trim();
        const output = document.getElementById("singleStudent");

        if (!id || !Number.isInteger(Number(id)) || Number(id) < 1) {
            output.textContent = "Enter a database ID from 1 to 5.";
            return;
        }

        output.textContent = "Searching...";

        try {
            const response = await fetch(
                "/students/" + encodeURIComponent(id)
            );

            const data = await response.json();

            if (!response.ok) {
                output.textContent = data.error || "Student not found.";
                return;
            }

            output.textContent =
                "Database ID: " + data.id +
                " | Student ID: " + data.student_id +
                " | Name: " + data.name +
                " | Program: " + data.program +
                " | Year: " + data.year +
                " | Section: " + data.section;
        } catch (error) {
            output.textContent = "Unable to retrieve student.";
            console.error(error);
        }
    }


    // Additional task: filter by section
    async function filterStudents() {
        const section = document.getElementById("sectionInput").value;
        const output = document.getElementById("sectionResults");

        output.textContent = "Loading section records...";

        try {
            const response = await fetch(
                "/students/section/" + encodeURIComponent(section)
            );

            if (!response.ok) {
                throw new Error("Unable to load section records");
            }

            const students = await response.json();
            output.replaceChildren();

            if (students.length === 0) {
                output.textContent = "No students found in this section.";
                return;
            }

            students.forEach(student => {
                const card = document.createElement("div");
                card.className = "student";

                const details = document.createElement("p");
                details.textContent =
                    student.student_id + " - " +
                    student.name + " | " +
                    student.program + " | Year " +
                    student.year + " | Section " +
                    student.section;

                card.appendChild(details);
                output.appendChild(card);
            });
        } catch (error) {
            output.textContent = "Unable to retrieve section records.";
            console.error(error);
        }
    }
</script>

</body>
</html>
